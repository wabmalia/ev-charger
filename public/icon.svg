<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22262b"/>
      <stop offset="1" stop-color="#0f1113"/>
    </linearGradient>
    <!-- hazard stripes for the "charge level" -->
    <pattern id="hazard" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="44" height="44" fill="#f5b301"/>
      <rect width="22" height="44" fill="#14110a"/>
    </pattern>
    <clipPath id="cell"><rect x="186" y="156" width="140" height="230" rx="18"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- battery body and terminal, inside the maskable safe zone -->
  <rect x="166" y="136" width="180" height="270" rx="32" fill="none" stroke="#f5b301" stroke-width="24"/>
  <rect x="216" y="100" width="80" height="34" rx="10" fill="#f5b301"/>
  <!-- charge level -->
  <rect x="186" y="318" width="140" height="68" fill="url(#hazard)" clip-path="url(#cell)"/>
  <!-- bolt, outlined in charcoal so it reads over the stripes -->
  <path d="M278 160 198 282h56l-20 100 86-132h-58z" fill="#ff8a1f" stroke="#0f1113" stroke-width="12" stroke-linejoin="round" paint-order="stroke"/>
</svg>
